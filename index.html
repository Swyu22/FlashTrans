<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashTrans · 中英互译</title>
  <meta name="description" content="FlashTrans —— 极简中英互译工具：信、达、雅。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232563eb' d='M13 2 4.09 12.35a.6.6 0 0 0 .46.98H11l-1.8 8.08c-.12.53.6.82.9.4L19.91 11a.6.6 0 0 0-.46-.98H13l1.8-6.62c.13-.53-.6-.83-.9-.4Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M13 2 4.09 12.35a.6.6 0 0 0 .46.98H11l-1.8 8.08c-.12.53.6.82.9.4L19.91 11a.6.6 0 0 0-.46-.98H13l1.8-6.62c.13-.53-.6-.83-.9-.4Z"/>
      </svg>
      <span class="brand-name">FlashTrans</span>
    </div>
    <span class="tagline">中英互译 · 信达雅</span>
  </header>

  <main class="panels">
    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">原文</span>
        <span class="direction-tag idle" id="directionTag">自动检测</span>
      </div>
      <textarea id="input" placeholder="输入中文或英文，自动识别并互译" spellcheck="false" autofocus></textarea>
      <div class="panel-foot">
        <div class="btn-group">
          <button type="button" id="btnPaste" class="btn">粘贴</button>
          <button type="button" id="btnCopyInput" class="btn">复制</button>
          <button type="button" id="btnClear" class="btn">清空</button>
        </div>
        <span class="char-count" id="charCount">0 字</span>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">译文</span>
        <span class="status" id="status"></span>
      </div>
      <div class="output" id="output"><span class="placeholder">译文将在此显示</span></div>
      <div class="panel-foot">
        <div class="btn-group">
          <button type="button" id="btnCopyOutput" class="btn">复制</button>
        </div>
      </div>
    </section>
  </main>

  <div class="translate-row">
    <button type="button" id="btnTranslate" class="btn-primary">翻 译</button>
    <span class="hint">Ctrl / ⌘ + Enter</span>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
